name: Archive

# Release 構成の Archive は統合ブランチの epic/** だけで確認する。
# 作業ブランチの push ごとに走らせると macOS ランナーの枠（同時 5 ジョブ）を埋めるため、作業ブランチは Build だけにする
on:
  push:
    branches:
      - 'epic/**'

concurrency:
  group: archive-working-${{ github.ref }}
  cancel-in-progress: true

jobs:
  archive:
    name: working (${{ matrix.platform }})
    runs-on: macos-latest

    # 片方が落ちてももう片方の結果を見たいので fail-fast は無効にする
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS
            sdk: macosx
          - platform: iOS
            sdk: iphoneos

    steps:
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Checkout
        uses: actions/checkout@v7

      - name: ci_post_clone
        run: |
          defaults write com.apple.dt.Xcode IDESkipPackagePluginFingerprintValidatation -bool YES

      # 署名は Upload ワークフローの書き出し時に App Store Connect API キーで行うので、ここでは署名しない
      - name: Archive
        run: |
          xcodebuild archive \
            -project OneTone.xcodeproj \
            -scheme OneTone \
            -sdk ${{ matrix.sdk }} \
            -configuration Release \
            -archivePath build.xcarchive \
            CODE_SIGNING_ALLOWED=NO
