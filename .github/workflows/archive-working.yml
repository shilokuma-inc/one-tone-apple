name: Archive

# Release 構成の Archive は、AskHub の作業ブランチ askhub/<epic の id>（子 PR を集めて最終 PR で develop に取り込む）だけで確認する。
# 子 PR のブランチやフィーチャーブランチの push ごとに走らせると macOS ランナーの枠（同時 5 ジョブ）を埋めるため、それらは Build だけにする
on:
  push:
    branches:
      - 'askhub/*'

concurrency:
  group: archive-working-${{ github.ref }}
  cancel-in-progress: true

jobs:
  archive:
    # 子 PR のブランチ（askhub/<epic の id>-<タスク>）と、AskHub の準備・版の上げのブランチ（askhub/setup-workflows など）は名前に - を含むので除く
    if: ${{ !contains(github.ref_name, '-') }}
    name: working (${{ matrix.platform }})
    runs-on: macos-latest

    # 片方が落ちてももう片方の結果を見たいので fail-fast は無効にする
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS
            sdk: macosx
          - platform: iOS
            sdk: iphoneos

    steps:
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.6'

      - name: Checkout
        uses: actions/checkout@v7

      - name: ci_post_clone
        run: |
          defaults write com.apple.dt.Xcode IDESkipPackagePluginFingerprintValidatation -bool YES

      # 署名は Upload ワークフローの書き出し時に App Store Connect API キーで行うので、ここでは署名しない
      - name: Archive
        run: |
          xcodebuild archive \
            -project OneTone.xcodeproj \
            -scheme OneTone \
            -sdk ${{ matrix.sdk }} \
            -configuration Release \
            -archivePath build.xcarchive \
            CODE_SIGNING_ALLOWED=NO
