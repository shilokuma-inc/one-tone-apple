name: Creative assets/App Store

# プロダクトページのヘッダーと検索結果のクリエイティブアセット（iOS 27 / iPadOS 27 以降の App Store に出る）を
# App Store Connect の App Asset Library に上げ、編集できるバージョンに配置する。
#
# 置き場所・寸法・配置する platform は AppStore/creative_assets.json、画像は AppStore/creative/<言語>/。
# 画像を作り直すときは Tools/render_creative_assets.sh で書き出してからコミットする。
# iOS / iPadOS の App Store にだけ出るので、iOS のバージョンにだけ配置する（macOS のバージョンには置かない）。
#
# 反映先は「編集できる状態のバージョン」だけ。審査中・配信済みのバージョンには触らない。
# 配置したアセットはそのバージョンと一緒に審査に出るので、審査に出す前のバージョンを app_version で指定する。
# mode:
#   dry-run  … 配置の予定（反映先のバージョン・言語・仕様・グループ・外す既存の配置の数）だけ出す（既定）
#   upload   … 反映する
#   ref-data … 置き場所と画像の仕様（App Asset Library の参照データ）を出す。画像は見ない

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'dry-run: 配置の予定だけ出す / upload: 反映する / ref-data: 置き場所と画像の仕様を出す'
        type: choice
        options:
          - dry-run
          - upload
          - ref-data
        default: dry-run
      languages:
        description: '反映する言語（カンマ区切り）。空なら languages.json の全言語（12 言語）'
        required: false
        default: ''
      app_version:
        description: '反映先のバージョン。空なら編集できるバージョンを自動で選ぶ'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  creative-assets:
    name: ${{ inputs.mode || 'dry-run' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Create Private Key
        run: |
          set -euo pipefail
          mkdir -p private_keys
          echo -n '${{ secrets.APPLE_API_KEY_BASE64 }}' | base64 --decode > private_keys/AuthKey.p8

      - name: Run against App Store Connect
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY_PATH: private_keys/AuthKey.p8
          # workflow_dispatch 以外から動いたときは choice の既定値に揃える
          MODE: ${{ inputs.mode || 'dry-run' }}
          LANGUAGES: ${{ inputs.languages }}
          APP_VERSION: ${{ inputs.app_version }}
        run: |
          set -euo pipefail
          # PyJWT は標準では入っていないので、この実行かぎりの venv に入れる
          python3 -m venv .venv
          .venv/bin/pip install --quiet --disable-pip-version-check pyjwt cryptography

          options=()
          case "$MODE" in
            dry-run) options+=(--dry-run) ;;
            ref-data) options+=(--ref-data) ;;
            upload) ;;
            *) echo "::error::不明な mode: $MODE"; exit 1 ;;
          esac
          if [ -n "$LANGUAGES" ]; then
            options+=(--languages "$LANGUAGES")
          fi
          if [ -n "$APP_VERSION" ]; then
            options+=(--app-version "$APP_VERSION")
          fi

          # bundle id は project.pbxproj から読む（ワークフローに書き写すと二重管理になるため）
          .venv/bin/python -u Tools/upload_creative_assets.py ${options[@]+"${options[@]}"} | tee "$RUNNER_TEMP/upload.log"

      - name: Summary
        if: always()
        env:
          MODE: ${{ inputs.mode || 'dry-run' }}
        run: |
          set -euo pipefail
          {
            echo "## クリエイティブアセット（${MODE}）"
            echo
            echo '```'
            cat "$RUNNER_TEMP/upload.log" 2>/dev/null || echo "（出力なし）"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
